name: Build Insights pages

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: build-insights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sanitize-html@2.13.0
      - run: node scripts/build-insights.mjs
      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "esyton-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- insights
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Insights article pages"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "Could not push after 5 attempts"; exit 1; fi
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
