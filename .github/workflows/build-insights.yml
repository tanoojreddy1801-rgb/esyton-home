name: Build Insights (Angular)

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes: picks up newly published articles
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    paths:
      - "insights-app/**"
      - ".github/workflows/build-insights.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: build-insights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: insights-app/package-lock.json

      - name: Install
        working-directory: insights-app
        run: npm ci

      # If this step fails (for example Firestore is unreachable), the live /insights/ folder is left untouched.
      - name: Build and prerender
        working-directory: insights-app
        run: npm run build

      - name: Replace /insights with the new build
        run: |
          rm -rf insights
          mkdir insights
          cp -r insights-app/dist/insights-app/browser/. insights/

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "esyton-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- insights
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Insights site"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "Could not push after 5 attempts"; exit 1; fi
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
